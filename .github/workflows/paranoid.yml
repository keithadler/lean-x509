name: Paranoid check

on:
  workflow_dispatch:
  push:
    branches: [bump-lean-4.35.0]

jobs:
  paranoid:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Allow unprivileged user namespaces (needed by the bwrap sandbox)
        run: |
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Write the manifest
        run: lake build --no-build 2>/dev/null || lake update

      - name: Recheck with every bundled kernel
        run: lake check --paranoid
